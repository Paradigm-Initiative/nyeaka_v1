allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: set this to true or false
permissions:
  dotenv:
    skills: [dotenv, dotenvx]
skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
